<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grabwächter</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#14101c; color:#f1e9d2; font:18px/1.5 system-ui, sans-serif; text-align:center; }
  main { max-width:520px; padding:24px; }
  h1 { color:#e8b04a; margin:0 0 8px; }
  p { color:#b9b0a0; }
  a.btn { display:inline-block; margin-top:14px; padding:10px 18px; background:#e8b04a; color:#1a1408; border-radius:6px; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>Grabwächter</h1>
  <p id="msg">Suche das laufende Spiel …</p>
  <div id="extra"></div>
</main>
<script>
  // Diese Seite leitet auf das Spiel um, das der Gastgeber gerade freigibt (die Adresse ändert sich bei jedem Start).
  const API = 'https://api.github.com/repos/ItzVIadi/grab/contents/link.json';
  const MAX_AGE = 24 * 3600 * 1000;
  const msg = document.getElementById('msg'), extra = document.getElementById('extra');
  let tries = 0;
  async function look() {
    try {
      const r = await fetch(API + '?t=' + Date.now(), { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
      const j = await r.json();
      const data = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g, '')))));
      let alive = false;
      if (data.url && /^https:\/\/[a-z0-9-]+\.trycloudflare\.com\/?$/.test(data.url) && Date.now() - data.at < MAX_AGE) {
        // läuft die Sitzung wirklich noch? (der Server liefert version.json mit CORS)
        try { alive = (await fetch(data.url.replace(/\/?$/, '/') + 'version.json?t=' + Date.now(), { cache: 'no-store' })).ok; } catch (e) { alive = false; }
      }
      if (alive) {
        msg.textContent = 'Spiel gefunden. Du wirst verbunden …';
        extra.textContent = '';
        const a = document.createElement('a'); a.className = 'btn'; a.href = data.url; a.textContent = 'Falls nichts passiert: hier klicken'; extra.appendChild(a);
        location.replace(data.url + location.search + location.hash);
        return;
      }
      msg.textContent = 'Der Gastgeber hat das Spiel gerade nicht gestartet. Diese Seite prüft alle 10 Sekunden erneut.';
    } catch (e) {
      msg.textContent = 'Konnte die Adresse nicht lesen (' + (e && e.message || e) + '). Neuer Versuch in 10 Sekunden.';
    }
    if (++tries < 360) setTimeout(look, 10000);
  }
  look();
</script>
</body>
</html>
